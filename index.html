<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">

    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/index.js"></script>
    <title>PlainToDo</title>
</head>
<body>
    <aside>
        <header>
            <span data-icon="checklist"></span>
            <span class="block">Taskboard</span>
        </header>

        <div class="categories" data-el="category-list">
            <span class="sub-text">Categories</span>

            <div class="categories-item cat-all" data-category="all">
                <div class="dot"></div>
                <span>All tasks</span>
                <div class="badge">6</div>
            </div>
            <div class="categories-item cat-work" data-category="work">
                <div class="dot"></div>
                <span>Work</span>
                <div class="badge">2</div>
            </div>
            <div class="categories-item cat-personal" data-category="personal">
                <div class="dot"></div>
                <span>Personal</span>
                <div class="badge">2</div>
            </div>
            <div class="categories-item cat-study" data-category="study">
                <div class="dot"></div>
                <span>Study</span>
                <div class="badge">2</div>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <div class="date">
                <span data-el="day"></span>
                <span class="sub-text" data-el="date"></span>
            </div>
            <div class="time">
                <span data-icon="clock"></span>
                <span data-el="time"></span>
            </div>
        </header>

        <dl class="stat">
            <div class="stat-tile stat-total">
                <dt class="stat-label">Total</dt>
                <dd class="stat-value" data-stat="total">6</dd>
            </div>
            <div class="stat-tile stat-active">
                <dt class="stat-label">Active</dt>
                <dd class="stat-value" data-stat="active">4</dd>
            </div>
            <div class="stat-tile stat-done">
                <dt class="stat-label">Done</dt>
                <dd class="stat-value" data-stat="done">2</dd>
            </div>
            <div class="stat-tile stat-high">
                <dt class="stat-label">High</dt>
                <dd class="stat-value" data-stat="high">1</dd>
            </div>
        </dl>

        <form>
            <label>
                <input type="text" name="title" id="title" placeholder="Prepare sprint demo">
            </label>
            <div>
                <label for="category">
                    <select name="category" id="category">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="study">Study</option>
                    </select>
                </label>


                <label for="priority">
                    <select name="priority" id="priority">
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                </label>


                <button type="submit">
                    <span data-icon="plus"></span>
                    Add task
                </button>
            </div>
        </form>


        <section class="task-list">
            <span data-el="task-count" class="sub-text">6 tasks</span>

            <ul class="task-items" data-el="task-list" role="list">

            </ul>

            <!-- Empty state -->
            <div class="empty-state" data-el="empty-state" role="status" hidden>
                <span class="empty-state-icon" data-icon="clipboard"></span>
                <p class="empty-state-title" data-el="empty-title">No tasks yet</p>
                <p class="empty-state-text">Add your first task using the form above.</p>
            </div>
        </section>
    </main>

<!-- Task Template -->
    <template id="task-template">
        <li class="task">
            <button class="checkbox" type="button">
                <span data-icon></span>
            </button>
            <div>
                <span class="title"></span>
                <div class="task-description">
                    <div class="badge" data-slot="priority"></div>
                    <div class="badge" data-slot="category"></div>
                    <span class="createdAt">Added <time></time></span>
                </div>
            </div>
            <button class="btn-delete" type="button">
                <span data-icon="trash"></span>
                Delete
            </button>
        </li>
    </template>


</body>
</html>
