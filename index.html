<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">

    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/index.js"></script>
    <title>PlainToDo</title>
</head>
<body>
    <aside>
        <header>
            <span data-icon="checklist"></span>
            <h1 class="block">Taskboard</h1>
        </header>

        <nav class="categories" data-el="category-list" aria-labelledby="categories-heading">
            <h2 id="categories-heading" class="sub-text">Categories</h2>

            <ul class="categories-list" role="list">
                <li>
                    <button type="button" class="categories-item cat-all" data-category="all" aria-pressed="true">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="categories-name">All tasks</span>
                        <span class="badge"></span>
                    </button>
                </li>
                <li>
                    <button type="button" class="categories-item cat-work" data-category="work" aria-pressed="false">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="categories-name">Work</span>
                        <span class="badge"></span>
                    </button>
                </li>
                <li>
                    <button type="button" class="categories-item cat-personal" data-category="personal" aria-pressed="false">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="categories-name">Personal</span>
                        <span class="badge"></span>
                    </button>
                </li>
                <li>
                    <button type="button" class="categories-item cat-study" data-category="study" aria-pressed="false">
                        <span class="dot" aria-hidden="true"></span>
                        <span class="categories-name">Study</span>
                        <span class="badge"></span>
                    </button>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <header>
            <div class="date">
                <span data-el="day"></span>
                <span class="sub-text" data-el="date"></span>
            </div>
            <div class="time" data-el="clock">
                <span data-icon="clock"></span>
                <span data-el="time"></span>
            </div>
        </header>

        <dl class="stat" aria-label="Task summary">
            <div class="stat-tile stat-total">
                <dt class="stat-label">Total</dt>
                <dd class="stat-value" data-stat="total"></dd>
            </div>
            <div class="stat-tile stat-active">
                <dt class="stat-label">Active</dt>
                <dd class="stat-value" data-stat="active"></dd>
            </div>
            <div class="stat-tile stat-done">
                <dt class="stat-label">Done</dt>
                <dd class="stat-value" data-stat="done"></dd>
            </div>
            <div class="stat-tile stat-high">
                <dt class="stat-label">High</dt>
                <dd class="stat-value" data-stat="high"></dd>
            </div>
        </dl>

        <form id="add-form" data-el="add-form" aria-label="Add task">
            <label for="title" class="visually-hidden">Title</label>
            <input type="text" name="title" id="title" placeholder="Prepare sprint demo" maxlength="200" autofocus required>
            <div>
                <label for="category" class="visually-hidden">Category</label>
                <select name="category" id="category">
                    <option value="work">Work</option>
                    <option value="personal">Personal</option>
                    <option value="study">Study</option>
                </select>


                <label for="priority" class="visually-hidden">
                    Priority
                </label>
                <select name="priority" id="priority">
                    <option value="high">High</option>
                    <option value="medium" selected>Medium</option>
                    <option value="low">Low</option>
                </select>


                <button type="submit">
                    <span data-icon="plus"></span>
                    Add task
                </button>
            </div>
        </form>


        <section class="task-list">
            <h2 id="tasks-heading" class="visually-hidden">Task List</h2>
            <p data-el="task-count" class="sub-text"></p>

            <ul class="task-items" data-el="task-list" role="list">
            </ul>

            <!-- Empty state -->
            <div class="empty-state" data-el="empty-state" role="status" hidden>
                <span class="empty-state-icon" data-icon="clipboard"></span>
                <p class="empty-state-title" data-el="empty-title">No tasks yet</p>
                <p class="empty-state-text">Add your first task using the form above.</p>
            </div>
        </section>
    </main>

<!-- Task Template -->
    <template id="task-template">
        <li class="task">
            <button class="checkbox" type="button">
                <span data-icon></span>
            </button>
            <div>
                <h3 class="title"></h3>
                <div class="task-description">
                    <div class="badge" data-slot="priority"></div>
                    <div class="badge" data-slot="category"></div>
                    <span class="createdAt">Added <time datetime="1970-01-01T00:00Z"></time></span>
                </div>
            </div>
            <button class="btn-delete" type="button">
                <span data-icon="trash"></span>
                Delete
            </button>
        </li>
    </template>


</body>
</html>
