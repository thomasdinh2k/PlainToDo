<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plain Todo App</title>
    <!--     Inter font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!--    Scripts  -->
    <script src="js/icons.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
<aside>
    <header>
        <div id="main-logo">Logo</div>
        <span class="block">Taskboard</span>
    </header>

    <nav class="categories">
        <h2 id="categories-heading" class="sub-text">Categories</h2>

        <ul class="categories-list">
            <li>
                <div class="categories-item cat-total">
                    <div class="dot"></div>
                    <span>All tasks</span>
                    <div class="badge">6</div>
                </div>
            </li>
            <li>
                <div class="categories-item cat-work">
                    <div class="dot"></div>
                    <span>Work</span>
                    <div class="badge">2</div>
                </div>
            </li>
            <li>
                <div class="categories-item cat-personal">
                    <div class="dot"></div>
                    <span>Personal</span>
                    <div class="badge">2</div>
                </div>
            </li>
            <li>
                <div class="categories-item cat-study">
                    <div class="dot"></div>
                    <span>Study</span>
                    <div class="badge">2</div>
                </div>
            </li>
        </ul>
    </nav>
</aside>

<main>
    <header>
        <div class="date">
            <span></span>
            <span></span>
        </div>
        <div class="time">
            <div>Clock Icon</div>
            <span></span>
        </div>
    </header>

    <dl class="stat">
        <div class="stat-total">
            <dt>Total</dt>
            <dd>0</dd>
        </div>
        <div class="stat-active">
            <dt>Active</dt>
            <dd>0</dd>
        </div>
        <div class="stat-done">
            <dt>Done</dt>
            <dd>0</dd>
        </div>
        <div class="stat-high">
            <dt>High</dt>
            <dd>0</dd>
        </div>
    </dl>

    <form id="add-form">
        <label for="title" class="visually-hidden">Title</label>
        <input type="text" name="title" id="title" placeholder="Prepare sprint demo" maxlength="200" required>
        <div>
            <label for="category" class="visually-hidden">Category</label>
            <select name="category" id="category">
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="study">Study</option>
            </select>


            <label for="priority" class="visually-hidden">
                Priority
            </label>
            <select name="priority" id="priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
            </select>


            <button type="submit">
                <span>Plus Icon</span>
                Add task
            </button>
        </div>
    </form>

    <section class="task-list">
        <h2 id="tasks-heading" class="visually-hidden">Task List</h2>
        <span id="task-quantity" class="sub-text"></span>
        <ul id="task-items" class="task-items" role="list">
        </ul>
    </section>
</main>


</body>
</html>
