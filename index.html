<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">

    <link rel="stylesheet" href="css/style.css">

    <script src="js/icons.js" defer></script>
    <script src="js/index.js" defer></script>
    <title>PlainToDo</title>
</head>
<body>
    <aside>
        <header>
            <span data-icon="checklist"></span>
            <span class="block">Taskboard</span>
        </header>

        <div class="categories">
            <span class="block">Categories</span>

            <div class="categories-item">
                <div class="dot"></div>
                <span>All tasks</span>
                <div class="badge">6</div>
            </div>
            <div class="categories-item blue">
                <div class="dot"></div>
                <span>Work</span>
                <div class="badge">2</div>
            </div>
            <div class="categories-item pink">
                <div class="dot"></div>
                <span>Personal</span>
                <div class="badge">2</div>
            </div>
            <div class="categories-item green">
                <div class="dot"></div>
                <span>Study</span>
                <div class="badge">2</div>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <div class="date">
                <span>Sunday</span>
                <span>November 8, 2026</span>
            </div>
            <div class="time">
                <span data-icon="clock"></span>
                <span>7:25:10 PM</span>
            </div>
        </header>

        <div class="stat">
            <div>
                <span class="block">Total</span>
                <span>6</span>
            </div>
            <div>
                <span class="block">Active</span><span>4</span></div>
            <div>
                <span class="block">Done</span><span>2</span></div>
            <div>
                <span class="block">High</span><span>1</span></div>
        </div>

        <form>
            <label>
                <input type="text" name="title" id="title" placeholder="Prepare sprint demo">
            </label>
            <div>
                <label for="category">
                    <select name="category" id="category">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="study">Study</option>
                    </select>
                </label>


                <label for="priority">
                    <select name="priority" id="priority">
                        <option value="work">High</option>
                        <option value="personal">Medium</option>
                        <option value="study">Low</option>
                    </select>
                </label>


                <button type="submit">
                    <span data-icon="plus"></span>
                    Add task
                </button>
            </div>
        </form>

        <div class="task-list">
            <span>6 tasks</span>

            <div class="task">
                <div class="checkbox">O</div>
                <div>
                    <span>Prepare quarterly report</span>
                    <div class="badge">High</div>
                    <div class="badge">Work</div>
                </div>
                <button>
                    <span data-icon="trash"></span>
                    Delete
                </button>
            </div>
            <div class="task">
                <div class="checkbox">O</div>
                <div>
                    <span>Prepare quarterly report</span>
                    <div class="badge">High</div>
                    <div class="badge">Work</div>
                </div>
                <button>
                    <span data-icon="trash"></span>
                    Delete
                </button>
            </div>
            <div class="task">
                <div class="checkbox">O</div>
                <div>
                    <span>Prepare quarterly report</span>
                    <div class="badge">High</div>
                    <div class="badge">Work</div>
                </div>
                <button>
                    <span data-icon="trash"></span>
                    Delete
                </button>
            </div>
            <div class="task">
                <div class="checkbox">O</div>
                <div>
                    <span>Prepare quarterly report</span>
                    <div class="badge">High</div>
                    <div class="badge">Work</div>
                </div>
                <button>
                    <span data-icon="trash"></span>
                    Delete
                </button>
            </div>
        </div>
    </main>


</body>
</html>
